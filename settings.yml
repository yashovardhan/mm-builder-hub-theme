enable_custom_homepage:
  type: bool
  default: true
  description:
    en: Enable the custom homepage with hero section and category grid

hero_title:
  type: string
  default: "Build the future of Web3 with MetaMask"
  description:
    en: Main heading displayed on the homepage hero section

hero_subtitle:
  type: string
  default: "Join the MetaMask developer community and start building today"
  description:
    en: Subtitle text displayed below the hero title

homepage_categories:
  type: list
  list_type: compact
  default: |
    getting-started|🚀|Begin your Web3 development journey
    sdk-apis|📦|Integrate MetaMask into your dApp
    snaps|🔌|Extend wallet functionality with Snaps
    security|🔒|Best practices for secure development
    smart-contracts|📝|Deploy and interact with contracts
    showcase|💡|Share your MetaMask projects
  description:
    en: "Configure homepage categories (one per line). Format: slug|icon|description"

layout_width:
  type: enum
  default: comfortable
  choices:
    - full
    - comfortable
    - compact

font_scale:
  type: enum
  default: comfortable
  choices:
    - compact
    - comfortable
    - large

enable_announcement_bar:
  type: bool
  default: true
  description:
    en: Show a docs-style announcement bar above the header

announcement_text:
  type: string
  default: "MetaMask SDK is now MetaMask Connect. Go multichain with one integration across Ethereum, Solana, and additional chains as support expands."
  description:
    en: Announcement bar message (plain text; link is appended from announcement link settings)

announcement_link:
  type: string
  default: "https://docs.metamask.io/metamask-connect/"
  description:
    en: URL for the announcement bar link

announcement_link_label:
  type: string
  default: "Get started"
  description:
    en: Label for the announcement bar link

show_docs_nav_links:
  type: bool
  default: true
  description:
    en: Show quick links to docs.metamask.io in the desktop header
